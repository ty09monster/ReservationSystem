<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>选择预约场馆 - 河南农业大学校史馆预约系统</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/h5.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/font_who/iconfont.css') }}" rel="stylesheet">
    <style>
        .reserve-page {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .reserve-container {
            max-width: 600px;
            margin: 0 auto;
            padding-top: 20px;
        }

        .page-header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .page-header h1 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .page-header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .venue-section {
            margin-bottom: 30px;
        }

        .venue-title {
            color: white;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .venue-card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-align: center;
        }

        .venue-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
        }

        .venue-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 28px;
        }

        .venue-card h3 {
            font-size: 17px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .venue-card .description {
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
        }

        .btn-reserve {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-reserve:hover {
            opacity: 0.9;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .back-section {
            margin-top: 30px;
            text-align: center;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: white;
            text-decoration: none;
            padding: 10px 18px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            transition: background 0.3s ease;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            color: white;
        }

        .notice-section {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .notice-section h3 {
            font-size: 15px;
            color: #333;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .notice-section ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .notice-section li {
            padding: 8px 0;
            color: #666;
            font-size: 14px;
            border-bottom: 1px solid #f0f2f5;
        }

        .notice-section li:last-child {
            border-bottom: none;
        }

        .notice-section li::before {
            content: "•";
            color: #667eea;
            font-weight: bold;
            margin-right: 8px;
        }
    </style>
</head>

<body>
    <div class="loading" id="loading"></div>

    <div class="reserve-page">
        <div class="reserve-container">
            <div class="page-header">
                <h1>选择预约场馆</h1>
                <p>请选择您要参观的场馆</p>
            </div>

            <div class="venue-section">
                <div class="venue-title">
                    🏛️ 校史馆
                </div>
                <div class="venue-card">
                    <div class="venue-icon">🏛️</div>
                    <h3>校史馆参观预约</h3>
                    <p class="description">参观河南农业大学校史馆，感受百年学府的深厚底蕴</p>
                    <a href="{{ url_for('h5.reserve_xiaoshi') }}" class="btn-reserve">
                        📅 立即预约
                    </a>
                </div>
            </div>

            <div class="notice-section">
                <h3>📋 预约须知</h3>
                <ul>
                    <li>支持<strong>个人预约</strong>和<strong>单位预约</strong>两种方式</li>
                    <li>预约成功后，请按预约时间准时到场馆参观</li>
                    <li>每人每天每个场馆最多预约1次</li>
                    <li>如需取消预约，请在"我的"页面操作</li>
                    <li>参观时请携带有效证件</li>
                </ul>
            </div>

            <div class="back-section">
                <a href="{{ url_for('h5.index') }}" class="back-btn">
                    ← 返回首页
                </a>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
    <script>
        window.onload = function () {
            setTimeout(function () {
                document.getElementById('loading').style.display = 'none';
            }, 500);
        };
    </script>
</body>

</html>
