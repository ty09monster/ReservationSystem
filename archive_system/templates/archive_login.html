<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>档案馆审批端 - 登录</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0d47a1 0%, #1976d2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            padding: 48px 40px;
            width: 400px;
            max-width: 90vw;
        }
        .login-card h3 {
            font-weight: 700;
            color: #0d47a1;
            margin-bottom: 8px;
        }
        .login-card .subtitle {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 32px;
        }
        .login-card .btn-primary {
            background: linear-gradient(135deg, #0d47a1 0%, #1976d2 100%);
            border: none;
            padding: 10px 0;
            font-weight: 600;
        }
        .login-card .btn-primary:hover { opacity: 0.9; }
        .badge-archive {
            display: inline-block;
            background: #e3f2fd;
            color: #0d47a1;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <span class="badge-archive">档案馆</span>
        <h3>审批管理系统</h3>
        <p class="subtitle">档案馆预约审批端 · 领导 / 教师登录</p>
        {% with messages = get_flashed_messages() %}
        {% if messages %}
        <div class="alert alert-danger py-2">{{ messages[0] }}</div>
        {% endif %}
        {% endwith %}
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">用户名</label>
                <input type="text" name="username" class="form-control" placeholder="请输入用户名" required autofocus>
            </div>
            <div class="mb-4">
                <label class="form-label">密码</label>
                <input type="password" name="password" class="form-control" placeholder="请输入密码" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">登 录</button>
        </form>
        <div class="text-center mt-3">
            <a href="{{ url_for('admin.login') }}" class="text-muted small">管理后台入口</a>
            <span class="text-muted mx-2">|</span>
            <a href="{{ url_for('teacher.login') }}" class="text-muted small">校史馆审批入口</a>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
