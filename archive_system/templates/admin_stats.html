<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <title>数据统计 - 管理员后台</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
</head>

<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2">
                <div class="nav flex-column nav-pills" id="v-pills-tab" role="tablist">
                    <a href="{{ url_for('admin.dashboard') }}" class="nav-link">
                        📅 预约审核
                    </a>
                    <a href="{{ url_for('admin.dashboard', active_tab='notice') }}" class="nav-link">
                        📢 公告管理
                    </a>
                    <a href="{{ url_for('admin.dashboard', active_tab='config') }}" class="nav-link">
                        ⚙️ 系统配置
                    </a>
                    <a href="{{ url_for('admin.dashboard', active_tab='venue') }}" class="nav-link">
                        🏛️ 场馆管理
                    </a>
                    <a href="{{ url_for('admin.dashboard', active_tab='account') }}" class="nav-link">
                        👮 账号管理
                    </a>
                    <a href="{{ url_for('admin.stats') }}" class="nav-link active">
                        📊 数据统计
                    </a>
                    <a href="{{ url_for('admin.logout') }}" class="nav-link text-danger mt-4">
                        🚪 退出登录
                    </a>
                </div>
            </div>
            <div class="col-md-10">
                {% with messages = get_flashed_messages() %}
                {% if messages %}
                <div class="alert alert-info alert-dismissible fade show" role="alert">
                    {{ messages[0] }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close">
                    </button>
                </div>
                {% endif %}
                {% endwith %}

                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">数据统计</h3>
                    </div>
                    <div class="card-body">
                        <!-- 筛选控件 -->
                        <div class="row mb-4">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="timeRange">时间范围</label>
                                    <select id="timeRange" class="form-control">
                                        <option value="day">按日</option>
                                        <option value="week">按周</option>
                                        <option value="month" selected>按月</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="venueFilter">场馆筛选</label>
                                    <select id="venueFilter" class="form-control">
                                        <option value="all">全部场馆</option>
                                        <!-- 场馆选项将通过JavaScript动态添加 -->
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- 统计卡片 -->
                        <div class="row mb-4">
                            <div class="col-md-3">
                                <div class="info-box">
                                    <div class="info-box-content">
                                        <span class="info-box-text">总预约量</span>
                                        <span class="info-box-number" id="totalReservations">0</span>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="info-box">
                                    <div class="info-box-content">
                                        <span class="info-box-text">已同意预约</span>
                                        <span class="info-box-number" id="approvedReservations">0</span>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="info-box">
                                    <div class="info-box-content">
                                        <span class="info-box-text">总客流量</span>
                                        <span class="info-box-number" id="totalVisitors">0</span>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="info-box">
                                    <div class="info-box-content">
                                        <span class="info-box-text">平均时段利用率</span>
                                        <span class="info-box-number" id="avgUtilization">0%</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 图表区域 -->
                        <div class="row">
                            <!-- 预约量趋势 -->
                            <div class="col-md-6">
                                <div class="card">
                                    <div class="card-header">
                                        <h4 class="card-title">预约量趋势</h4>
                                    </div>
                                    <div class="card-body">
                                        <canvas id="reservationTrendChart" height="250"></canvas>
                                    </div>
                                </div>
                            </div>

                            <!-- 预约状态分布 -->
                            <div class="col-md-6">
                                <div class="card">
                                    <div class="card-header">
                                        <h4 class="card-title">预约状态分布</h4>
                                    </div>
                                    <div class="card-body">
                                        <canvas id="reservationStatusChart" height="250"></canvas>
                                    </div>
                                </div>
                            </div>

                            <!-- 个人/团体比例 -->
                            <div class="col-md-6">
                                <div class="card">
                                    <div class="card-header">
                                        <h4 class="card-title">个人/团体比例</h4>
                                    </div>
                                    <div class="card-body">
                                        <canvas id="reservationTypeChart" height="250"></canvas>
                                    </div>
                                </div>
                            </div>

                            <!-- 场馆/校区对比 -->
                            <div class="col-md-6">
                                <div class="card">
                                    <div class="card-header">
                                        <h4 class="card-title">场馆/校区对比</h4>
                                    </div>
                                    <div class="card-body">
                                        <canvas id="venueComparisonChart" height="250"></canvas>
                                    </div>
                                </div>
                            </div>

                            <!-- 客流量趋势 -->
                            <div class="col-md-6">
                                <div class="card">
                                    <div class="card-header">
                                        <h4 class="card-title">客流量趋势</h4>
                                    </div>
                                    <div class="card-body">
                                        <canvas id="visitorTrendChart" height="250"></canvas>
                                    </div>
                                </div>
                            </div>

                            <!-- 高峰时段分析 -->
                            <div class="col-md-6">
                                <div class="card">
                                    <div class="card-header">
                                        <h4 class="card-title">高峰时段分析</h4>
                                    </div>
                                    <div class="card-body">
                                        <canvas id="peakHoursChart" height="250"></canvas>
                                    </div>
                                </div>
                            </div>

                            <!-- 校区客流对比 -->
                            <div class="col-md-6">
                                <div class="card">
                                    <div class="card-header">
                                        <h4 class="card-title">校区客流对比</h4>
                                    </div>
                                    <div class="card-body">
                                        <canvas id="campusComparisonChart" height="250"></canvas>
                                    </div>
                                </div>
                            </div>

                            <!-- 时段利用率 -->
                            <div class="col-md-6">
                                <div class="card">
                                    <div class="card-header">
                                        <h4 class="card-title">时段利用率</h4>
                                    </div>
                                    <div class="card-body">
                                        <canvas id="timeUtilizationChart" height="250"></canvas>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 导出按钮 -->
                        <div class="row mt-4">
                            <div class="col-md-12">
                                <button id="exportExcel" class="btn btn-primary">导出Excel</button>
                                <button id="exportCSV" class="btn btn-secondary">导出CSV</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>

    <script>
        // 全局变量
        let timeRange = 'month';
        let venueFilter = 'all';
        let charts = {};

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function () {
            // 初始化筛选控件
            initFilters();

            // 初始化图表
            initCharts();

            // 加载统计数据
            loadStatistics();
        });

        // 初始化筛选控件
        function initFilters() {
            // 时间范围选择
            document.getElementById('timeRange').addEventListener('change', function () {
                timeRange = this.value;
                loadStatistics();
            });

            // 场馆筛选选择
            document.getElementById('venueFilter').addEventListener('change', function () {
                venueFilter = this.value;
                loadStatistics();
            });

            // 加载场馆列表
            loadVenues();
        }

        // 加载场馆列表
        function loadVenues() {
            fetch('/admin/get-venues')
                .then(response => response.json())
                .then(data => {
                    const venueFilter = document.getElementById('venueFilter');
                    data.venues.forEach(venue => {
                        const option = document.createElement('option');
                        option.value = venue.id;
                        option.textContent = venue.name;
                        venueFilter.appendChild(option);
                    });
                })
                .catch(error => {
                    console.error('Error loading venues:', error);
                });
        }

        // 初始化图表
        function initCharts() {
            // 预约量趋势图表
            charts.reservationTrend = new Chart(
                document.getElementById('reservationTrendChart'),
                {
                    type: 'line',
                    data: {
                        labels: [],
                        datasets: [{
                            label: '预约量',
                            data: [],
                            borderColor: 'rgba(54, 162, 235, 1)',
                            backgroundColor: 'rgba(54, 162, 235, 0.2)',
                            tension: 0.1
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false
                    }
                }
            );

            // 预约状态分布图表
            charts.reservationStatus = new Chart(
                document.getElementById('reservationStatusChart'),
                {
                    type: 'pie',
                    data: {
                        labels: [],
                        datasets: [{
                            data: [],
                            backgroundColor: [
                                'rgba(255, 99, 132, 0.8)',
                                'rgba(54, 162, 235, 0.8)',
                                'rgba(255, 206, 86, 0.8)'
                            ]
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false
                    }
                }
            );

            // 个人/团体比例图表
            charts.reservationType = new Chart(
                document.getElementById('reservationTypeChart'),
                {
                    type: 'doughnut',
                    data: {
                        labels: [],
                        datasets: [{
                            data: [],
                            backgroundColor: [
                                'rgba(75, 192, 192, 0.8)',
                                'rgba(153, 102, 255, 0.8)'
                            ]
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false
                    }
                }
            );

            // 场馆/校区对比图表
            charts.venueComparison = new Chart(
                document.getElementById('venueComparisonChart'),
                {
                    type: 'bar',
                    data: {
                        labels: [],
                        datasets: [{
                            label: '预约量',
                            data: [],
                            backgroundColor: 'rgba(255, 99, 132, 0.8)'
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false
                    }
                }
            );

            // 客流量趋势图表
            charts.visitorTrend = new Chart(
                document.getElementById('visitorTrendChart'),
                {
                    type: 'line',
                    data: {
                        labels: [],
                        datasets: [{
                            label: '客流量',
                            data: [],
                            borderColor: 'rgba(75, 192, 192, 1)',
                            backgroundColor: 'rgba(75, 192, 192, 0.2)',
                            tension: 0.1
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false
                    }
                }
            );

            // 高峰时段分析图表
            charts.peakHours = new Chart(
                document.getElementById('peakHoursChart'),
                {
                    type: 'bar',
                    data: {
                        labels: [],
                        datasets: [{
                            label: '客流量',
                            data: [],
                            backgroundColor: 'rgba(153, 102, 255, 0.8)'
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false
                    }
                }
            );

            // 校区客流对比图表
            charts.campusComparison = new Chart(
                document.getElementById('campusComparisonChart'),
                {
                    type: 'pie',
                    data: {
                        labels: [],
                        datasets: [{
                            data: [],
                            backgroundColor: [
                                'rgba(255, 159, 64, 0.8)',
                                'rgba(54, 162, 235, 0.8)',
                                'rgba(255, 206, 86, 0.8)',
                                'rgba(75, 192, 192, 0.8)'
                            ]
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false
                    }
                }
            );

            // 时段利用率图表
            charts.timeUtilization = new Chart(
                document.getElementById('timeUtilizationChart'),
                {
                    type: 'bar',
                    data: {
                        labels: [],
                        datasets: [{
                            label: '利用率 (%)',
                            data: [],
                            backgroundColor: 'rgba(255, 99, 132, 0.8)'
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: {
                                beginAtZero: true,
                                max: 100
                            }
                        }
                    }
                }
            );
        }

        // 加载统计数据
        function loadStatistics() {
            // 加载预约量趋势
            fetch(`/admin/stats/reservation-trend?time_range=${timeRange}`)
                .then(response => response.json())
                .then(data => {
                    updateChart('reservationTrend', data.labels, data.values);
                })
                .catch(error => {
                    console.error('Error loading reservation trend:', error);
                });

            // 加载预约状态分布
            fetch('/admin/stats/reservation-status')
                .then(response => response.json())
                .then(data => {
                    updateChart('reservationStatus', data.labels, data.values);
                })
                .catch(error => {
                    console.error('Error loading reservation status:', error);
                });

            // 加载个人/团体比例
            fetch('/admin/stats/reservation-type')
                .then(response => response.json())
                .then(data => {
                    updateChart('reservationType', data.labels, data.values);
                })
                .catch(error => {
                    console.error('Error loading reservation type:', error);
                });

            // 加载场馆/校区对比
            fetch('/admin/stats/venue-comparison')
                .then(response => response.json())
                .then(data => {
                    updateChart('venueComparison', data.labels, data.values);
                })
                .catch(error => {
                    console.error('Error loading venue comparison:', error);
                });

            // 加载客流量趋势
            fetch(`/admin/stats/visitor-trend?time_range=${timeRange}`)
                .then(response => response.json())
                .then(data => {
                    updateChart('visitorTrend', data.labels, data.values);
                })
                .catch(error => {
                    console.error('Error loading visitor trend:', error);
                });

            // 加载高峰时段分析
            fetch('/admin/stats/peak-hours')
                .then(response => response.json())
                .then(data => {
                    updateChart('peakHours', data.labels, data.values);
                })
                .catch(error => {
                    console.error('Error loading peak hours:', error);
                });

            // 加载校区客流对比
            fetch('/admin/stats/campus-comparison')
                .then(response => response.json())
                .then(data => {
                    updateChart('campusComparison', data.labels, data.values);
                })
                .catch(error => {
                    console.error('Error loading campus comparison:', error);
                });

            // 加载时段利用率
            fetch('/admin/stats/time-utilization')
                .then(response => response.json())
                .then(data => {
                    updateChart('timeUtilization', data.labels, data.values);
                })
                .catch(error => {
                    console.error('Error loading time utilization:', error);
                });

            // 加载总统计数据
            loadTotalStatistics();
        }

        // 加载总统计数据
        function loadTotalStatistics() {
            // 从API端点获取真实的总统计数据
            fetch('/admin/stats/total')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('totalReservations').textContent = data.total_reservations;
                    document.getElementById('approvedReservations').textContent = data.approved_reservations;
                    document.getElementById('totalVisitors').textContent = data.total_visitors;
                    document.getElementById('avgUtilization').textContent = data.avg_utilization + '%';
                })
                .catch(error => {
                    console.error('Error loading total statistics:', error);
                    // 出错时使用默认值
                    document.getElementById('totalReservations').textContent = '0';
                    document.getElementById('approvedReservations').textContent = '0';
                    document.getElementById('totalVisitors').textContent = '0';
                    document.getElementById('avgUtilization').textContent = '0%';
                });
        }

        // 更新图表数据
        function updateChart(chartName, labels, values) {
            if (charts[chartName]) {
                charts[chartName].data.labels = labels;
                charts[chartName].data.datasets[0].data = values;
                charts[chartName].update();
            }
        }

        // 导出功能
        document.getElementById('exportExcel').addEventListener('click', function () {
            alert('Excel导出功能开发中');
        });

        document.getElementById('exportCSV').addEventListener('click', function () {
            alert('CSV导出功能开发中');
        });
    </script>
</body>

</html>
