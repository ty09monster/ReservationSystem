<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="河南农业大学档案馆农业资源标本馆预约系统">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>河南农业大学档案馆预约系统</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/h5.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/font_who/iconfont.css') }}" rel="stylesheet">
    <style>
        .landing-page {
            min-height: 100vh;
            min-height: 100dvh;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 20px;
            padding: 0 max(20px, env(safe-area-inset-left)) 0 max(20px, env(safe-area-inset-right));
        }

        .landing-header {
            position: relative;
            text-align: center;
            padding: clamp(20px, 4vh, 32px) 16px;
            width: 100%;
            max-width: 420px;
            min-height: 180px;
            background-image: url("{{ url_for('static', filename='images/a.jpg') }}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #f5f5f5;
            border-radius: var(--radius-md);
        }

        .landing-header .emblem {
            position: absolute;
            top: 10px;
            left: 10px;
            width: clamp(32px, 5vw, 44px);
            height: clamp(32px, 5vw, 44px);
            margin-bottom: 0;
        }

        .landing-header h1 {
            font-size: clamp(1.05rem, 3.5vw, 1.35rem);
            font-weight: 700;
            color: var(--text-primary);
            margin: 0;
            letter-spacing: 1px;
        }

        .landing-header p {
            font-size: clamp(0.7rem, 2vw, 0.85rem);
            color: var(--text-tertiary);
            margin: 4px 0 0;
            letter-spacing: 0.5px;
        }

        .module-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: clamp(12px, 3vw, 20px);
            width: 100%;
            max-width: 420px;
            margin-top: clamp(16px, 4vh, 32px);
            padding-bottom: clamp(20px, 5vh, 48px);
            padding-bottom: max(clamp(20px, 5vh, 48px), env(safe-area-inset-bottom));
        }

        .module-card {
            background: linear-gradient(135deg, var(--green-600) 0%, var(--green-500) 100%);
            border-radius: var(--radius-lg);
            padding: clamp(18px, 4vh, 32px) clamp(10px, 3vw, 20px) clamp(14px, 3vh, 24px);
            text-align: center;
            box-shadow: var(--shadow-md);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: clamp(6px, 1.5vh, 12px);
            min-height: clamp(100px, 22vh, 150px);
            color: #fff;
        }

        .module-card:active {
            transform: scale(0.96);
            box-shadow: var(--shadow-sm);
        }

        .module-icon {
            width: clamp(44px, 10vw, 64px);
            height: clamp(44px, 10vw, 64px);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(1.4rem, 4vw, 2rem);
        }

        .module-card:nth-child(1) .module-icon {
            background: rgba(255, 255, 255, 0.2);
        }

        .module-card:nth-child(2) .module-icon {
            background: rgba(255, 255, 255, 0.2);
        }

        .module-card:nth-child(3) .module-icon {
            background: rgba(255, 255, 255, 0.2);
        }

        .module-card:nth-child(4) .module-icon {
            background: rgba(255, 255, 255, 0.2);
        }

        .module-title {
            font-size: clamp(0.85rem, 2.5vw, 1rem);
            font-weight: 600;
            color: #fff;
            margin: 0;
        }

        .module-desc {
            font-size: clamp(0.65rem, 1.8vw, 0.75rem);
            color: rgba(255, 255, 255, 0.85);
            margin: 0;
            line-height: 1.5;
        }
    </style>
</head>

<body>
    <div class="landing-page">
        <div class="landing-header">
            <img src="{{ url_for('static', filename='images/emblem.png') }}" alt="校徽" class="emblem"
                onerror="this.style.display='none'">
            <h1>河南农业大学档案馆<br>（农业资源标本馆）</h1>
            <p class="subtitle">预约服务平台</p>
        </div>

        <div class="module-grid">
            <a href="{{ url_for('h5.index') }}" class="module-card">
                <div class="module-icon">📅</div>
                <h2 class="module-title">预约服务</h2>
                <p class="module-desc">场地参观<br>活动预约</p>
            </a>
            <a href="{{ url_for('h5.venue_news') }}" class="module-card">
                <div class="module-icon">📰</div>
                <h2 class="module-title">馆务动态</h2>
                <p class="module-desc">场馆最新<br>动态资讯</p>
            </a>
            <a href="{{ url_for('h5.faq') }}" class="module-card">
                <div class="module-icon">💬</div>
                <h2 class="module-title">常见问题</h2>
                <p class="module-desc">预约常见<br>问题解答</p>
            </a>
            <a href="{{ url_for('h5.announcements') }}" class="module-card">
                <div class="module-icon">📢</div>
                <h2 class="module-title">通知公告</h2>
                <p class="module-desc">系统通知<br>与公告</p>
            </a>
        </div>
    </div>
</body>

</html>
